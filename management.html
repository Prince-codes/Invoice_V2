<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Invoice Management - Shankar Vegetable Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="management.css" />
</head>
<body>
  <main class="management-shell">
    <header class="topbar">
      <a class="management-brand" href="Selection/selection.html" aria-label="Shankar Vegetable Shop home">
        <img src="Assets/logo.png" alt="Shankar Vegetable Shop logo" />
        <span class="brand-info">
          <span class="brand-name">Shankar Vegetable Shop</span>
          <span class="brand-address">Gamharia market complex - 832108</span>
        </span>
      </a>
      <div class="header-actions">
        <span id="userDisplay" class="user-display">Signed in as: Guest</span>
        <button id="backBtn" class="btn secondary" type="button">Back to Selection</button>
        <button id="logoutBtn" class="btn" type="button">Log out</button>
      </div>
    </header>

    <section class="page-heading" aria-labelledby="pageTitle">
      <p class="eyebrow">Invoice workspace</p>
      <h1 id="pageTitle">Cloud Invoice Management</h1>
    </section>

    <section class="toolbar card">
      <div class="field-group">
        <label for="moduleFilter">Module</label>
        <select id="moduleFilter">
          <option value="mod1">Mod 1 — New Monthly Bill</option>
          <option value="mod2">Mod 2 — Daily Bill</option>
          <option value="mod3">Mod 3 — Old Monthly Bill</option>
        </select>
      </div>

      <div class="field-group inline-actions">
        <button id="loadInvoicesBtn" class="btn primary" type="button">Load Invoices</button>
        <button id="exportCsvBtn" class="btn" type="button">Export CSV</button>
        <button id="exportExcelBtn" class="btn" type="button">Export Excel</button>
        <button id="exportPdfBtn" class="btn" type="button">Export PDFs (ZIP)</button>
      </div>
      <p id="exportStatus" class="export-status" aria-live="polite"></p>
    </section>

    <section class="card table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer</th>
              <th>Module</th>
              <th>Date</th>
              <th>Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="invoiceTableBody">
            <tr>
              <td colspan="6" class="empty-state">No cloud invoices loaded.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="table-pagination">
        <span id="paginationStatus" class="user-display" aria-live="polite">Load invoices to view records.</span>
        <div class="pagination-actions">
          <button id="previousPageBtn" class="btn" type="button" disabled>Previous</button>
          <button id="nextPageBtn" class="btn" type="button" disabled>Next</button>
        </div>
      </div>
    </section>
  </main>

  <div id="invoiceDetailModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content large">
      <header>
        <h2>Invoice Details</h2>
        <button class="close-btn" id="closeDetailModal" type="button" aria-label="Close">&times;</button>
      </header>
      <div id="invoiceDetailContent" class="detail-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="Assets/excel-export.js"></script>
  <script src="invoice-export.js"></script>
  <script src="auth-client.js"></script>
  <script src="management.js"></script>
</body>
</html>
